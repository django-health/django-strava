[project]
name = "django-strava"
version = "0.2.0"
description = "A Django app for the Strava V3 API (2026 Developer Program), backed by django-healthdatamodel."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Andy Reagan", email = "andy@andyreagan.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "django",
    "django-healthdatamodel>=0.9.0",
    "httpx",
    "pydantic>=2",
    "python-dateutil",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-freezer",
    "respx",
]

[project.urls]
Homepage = "https://github.com/django-health/django-strava"
Repository = "https://github.com/django-health/django-strava"
Issues = "https://github.com/django-health/django-strava/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strava"]

[tool.hatch.build.targets.sdist]
include = [
    "strava/",
    "LICENSE",
    "README.md",
    "docs/",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
markers = [
    "live: requires real Strava OAuth credentials in env (STRAVA_TEST_*)",
]
